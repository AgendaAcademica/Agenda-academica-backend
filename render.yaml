services:
  - type: web
    name: agenda-academica-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: AI_FALLBACK_PROVIDER
        value: none
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: AI_CACHE_TTL_MINUTES
        value: "1440"
      - key: AI_CACHE_MAX_ENTRIES
        value: "100"
      - key: MAX_PDF_SIZE_MB
        value: "20"
      - key: CORS_ORIGIN
        value: "*"
