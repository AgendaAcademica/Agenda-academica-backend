services:
  - type: web
    name: agenda-academica-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: AI_PROVIDER
        value: gemini
      - key: AI_FALLBACK_PROVIDER
        value: none
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash-lite
      - key: OPENAI_MODEL
        value: gpt-5-mini
      - key: AI_CACHE_TTL_MINUTES
        value: "1440"
      - key: AI_CACHE_MAX_ENTRIES
        value: "100"
      - key: MAX_PDF_SIZE_MB
        value: "20"
      - key: CORS_ORIGIN
        value: "*"
      - key: FIREBASE_PROJECT_ID
        value: agendaacademicabd
      - key: FIRESTORE_DATABASE_ID
        value: "(default)"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: UNLIMITED_USER_EMAILS
        value: ""
      - key: ADMIN_UIDS
        sync: false
      - key: AI_PRICES_JSON
        sync: false
      - key: USER_DAILY_REQUESTS
        value: "20"
      - key: GLOBAL_DAILY_REQUESTS
        value: "200"
      - key: USER_REQUESTS_PER_MINUTE
        value: "3"
      - key: USER_DAILY_AI_ATTEMPTS
        value: "40"
      - key: GLOBAL_DAILY_AI_ATTEMPTS
        value: "400"
      - key: USER_DAILY_USD
        value: "1"
      - key: GLOBAL_DAILY_USD
        value: "10"
      - key: MAX_UPLOAD_TOTAL_MB
        value: "20"
      - key: MAX_CONCURRENT_EXTRACTIONS
        value: "2"
